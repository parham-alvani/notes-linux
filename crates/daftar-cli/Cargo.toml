[package]
name = "daftar-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Daftar on the command line: search, tasks, links and the picture cleanup of an Obsidian vault."

[[bin]]
name = "daftar-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
daftar-core = { version = "0.1.0", path = "../daftar-core" }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
md-5 = "0.11.0"
regex = "1.13.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
