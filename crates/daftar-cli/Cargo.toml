[package]
name = "daftar-cli"
version = "0.8.0"
edition.workspace = true
license.workspace = true
description = "Daftar on the command line: search, tasks, links and the picture cleanup of an Obsidian vault."

[[bin]]
name = "daftar-cli"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
daftar-core = { version = "0.8.0", path = "../daftar-core", features = ["web"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tiff"] }
md-5 = "0.11.0"
notify = "8.2.1"
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color"] }
rayon = "1.12.0"
regex = "1.13.1"
serde_json = "1.0.154"
unicode-width = "0.2.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
