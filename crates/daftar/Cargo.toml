[package]
name = "daftar"
version = "0.4.0"
edition.workspace = true
license.workspace = true
description = "Daftar for Linux: a native GTK app for an Obsidian vault in a Git repository."

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
chrono = "0.4.45"
daftar-core = { version = "0.4.0", path = "../daftar-core" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
include_dir = "0.7.4"
mime_guess = "2.0.5"
pangocairo = "0.22.9"
notify = { version = "8.2.1", default-features = false }
serde_json = "1.0.154"
soup = { version = "0.9.0", package = "soup3" }
sourceview5 = { version = "0.11.2", features = ["gtk_v4_14"] }
vte4 = { version = "0.10.0", features = ["v0_76"] }
webkit6 = "0.6.1"

[dev-dependencies]
tempfile = "3"
