[package]
name = "daftar-core"
version = "0.7.2"
edition.workspace = true
license.workspace = true
description = "Everything Daftar knows about a vault that needs no window: the parser, links, tasks, the index, search, the config file."

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
ego-tree = "0.11.1"
fancy-regex = "0.20.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.0", features = ["bundled"] }
scraper = "0.29.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
pulldown-cmark = { version = "0.13.5", default-features = false }
# `web`: fetching a page to clip, for the command line and the app.
ureq = { version = "3.5.0", optional = true }
markdown = "1.0.0"

[features]
web = ["dep:ureq"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
