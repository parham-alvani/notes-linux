[package]
name = "daftar-core"
version = "0.21.1"
edition.workspace = true
license.workspace = true
description = "Everything Daftar knows about a vault that needs no window: the parser, links, tasks, the index, search, the config file."

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
ego-tree = "0.11.1"
fancy-regex = "0.20.0"
percent-encoding = "2.3.2"
rayon = "1.12.0"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-normalization = "0.1.26"
walkdir = "2.5.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
# `web`: fetching a page to clip, for the command line and the app.
ureq = { version = "3.5.1", optional = true }
markdown = "1.0.0"
# `semantic`: search by meaning, with a static embedding model (Model2Vec)
# run in the process. Pure Rust: the tokenizer's regular expressions are
# fancy-regex, not Oniguruma, and its suffix arrays are not the C++ ones.
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
sha2 = { version = "0.10.9", optional = true }

[features]
web = ["dep:ureq"]
semantic = ["web", "dep:tokenizers", "dep:serde", "dep:sha2"]

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
