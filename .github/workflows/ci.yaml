name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch has the newest GTK, libadwaita and WebKitGTK, as the machines
    # that run Daftar do.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita webkitgtk-6.0 gtksourceview5 vte4 neovim sqlite nodejs npm just git
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: just lint
      - run: just test

  cli:
    # The command line runs wherever the vault is, not only on Linux: the
    # core needs no GTK, and SQLite is built into it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup default stable && rustup target add ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: cli-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --locked -p daftar-core -p daftar-cli --target ${{ matrix.target }}
      - run: cargo build --locked --release -p daftar-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="daftar-cli-$(cat VERSION)-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            cp "target/${{ matrix.target }}/release/daftar-cli.exe" "$name/"
            7z a "$name.zip" "$name" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/daftar-cli" "$name/"
            tar -czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: daftar-cli-${{ matrix.target }}
          path: daftar-cli-*.*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cli]
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita webkitgtk-6.0 gtksourceview5 vte4 sqlite nodejs npm just git github-cli
      - uses: actions/checkout@v7
      - name: The tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: just app
      - run: tar -czf "daftar-$(cat VERSION)-x86_64.tar.gz" -C target/release daftar daftar-cli -C ../../data me.parham1995.notes.desktop me.parham1995.notes.png
      - uses: actions/download-artifact@v8
        with:
          pattern: daftar-cli-*
          merge-multiple: true
      # GitHub fails a call now and then for some minutes: the Mac's 0.9.0
      # upload stopped half way and left an empty draft. Each call is tried
      # again, and the release stays a draft until every file is there and
      # checked, so the AUR and the tap never read a release with a file missing.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() {
            for wait in 10 20 40 80 0; do
              "$@" && return 0
              [ "$wait" -eq 0 ] && return 1
              echo "::warning::'$1 $2 $3' failed; trying again in ${wait}s"
              sleep "$wait"
            done
          }
          tag="$GITHUB_REF_NAME"
          files=(daftar-*.tar.gz daftar-cli-*.zip)
          # A create that made the release and then failed is not made twice.
          draft() { gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --verify-tag --title "$tag" --generate-notes; }
          retry draft
          retry gh release upload "$tag" "${files[@]}" --clobber
          # What is on the release is what was built.
          for file in "${files[@]}"; do
            want=$(sha256sum "$file" | cut -d' ' -f1)
            retry sh -c "gh release view '$tag' --json assets -q '.assets[] | select(.name == \"$file\") | .digest' | grep -qx 'sha256:$want'"
          done
          retry gh release edit "$tag" --draft=false --latest

  brew:
    # The tap's bump moves the daftar-cli formula to the release now, not at
    # its daily run. The workflow's own token cannot start a workflow in
    # another repository: TAP_TOKEN is a fine-grained token with Actions
    # read and write on parham-alvani/homebrew-tap only.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Start the tap's bump
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::TAP_TOKEN is not set; the tap's daily bump takes the release instead."; exit 1; }
          for wait in 10 20 40 80 0; do
            gh workflow run bump.yaml -R parham-alvani/homebrew-tap && exit 0
            [ "$wait" -eq 0 ] && exit 1
            echo "::warning::starting the bump failed; trying again in ${wait}s"
            sleep "$wait"
          done

  aur:
    # daftar-bin and daftar-cli-bin are built from the release's tarballs, so
    # they move once the release is public. AUR_SSH_KEY is the private half
    # of a key only for this job, added to the AUR account.
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel pacman-contrib git openssh just
      # The PKGBUILDs are committed back to main, so the job works on main,
      # not on the tag's detached HEAD.
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: The AUR's key
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          test -n "$AUR_SSH_KEY" || { echo "::error::AUR_SSH_KEY is not set; run 'just aur' by hand."; exit 1; }
          printf '%s\n' "$AUR_SSH_KEY" > "$RUNNER_TEMP/aur"
          chmod 600 "$RUNNER_TEMP/aur"
          # The AUR's ED25519 host key, SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4.
          echo 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$RUNNER_TEMP/aur_hosts"
      # makepkg refuses to run as root, so a user of its own updates the
      # PKGBUILDs; root pushes them, with the checkout's credentials.
      - name: Update the PKGBUILDs
        run: |
          useradd -m builder
          chown -R builder packaging/aur
          su builder -c "just aur-update ${GITHUB_REF_NAME#v}"
      - name: Push them to the AUR and to main
        env:
          GIT_SSH_COMMAND: ssh -i ${{ runner.temp }}/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=${{ runner.temp }}/aur_hosts
        run: just aur-push
