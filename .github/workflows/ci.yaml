name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch has the newest GTK, libadwaita and WebKitGTK, as the machines
    # that run Daftar do.
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita webkitgtk-6.0 sqlite nodejs npm just git
      - uses: actions/checkout@v7
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: just lint
      - run: just test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: write
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel rust gtk4 libadwaita webkitgtk-6.0 sqlite nodejs npm just git
      - uses: actions/checkout@v7
      - name: The tag matches VERSION
        run: test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
      - run: just app
      - run: tar -czf "daftar-$(cat VERSION)-x86_64.tar.gz" -C target/release daftar daftar-cli -C ../../data me.parham1995.notes.desktop me.parham1995.notes.png
      - uses: softprops/action-gh-release@v3
        with:
          files: daftar-*.tar.gz
          generate_release_notes: true
